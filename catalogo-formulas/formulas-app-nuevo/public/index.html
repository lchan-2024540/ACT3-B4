<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Catálogo de Fórmulas</title>
<style>
  :root {
    --fondo: #1a1a2e;
    --tarjeta: #16213e;
    --acento: #e94560;
    --acento-hover: #c73650;
    --texto: #f1f1f1;
    --texto-suave: #a8a8b3;
    --exito: #0f3d3e;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    max-width: 860px;
    margin: 0 auto;
    padding: 32px 20px 60px;
    background: var(--fondo);
    color: var(--texto);
  }
  h1 {
    color: var(--acento);
    font-size: 1.6rem;
    border-bottom: 2px solid var(--tarjeta);
    padding-bottom: 12px;
  }
  h2 { color: var(--texto-suave); font-size: 1.1rem; }
  .barra-acciones { display: flex; gap: 12px; margin: 20px 0 24px; flex-wrap: wrap; }
  .boton {
    background: var(--acento);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.9rem;
    transition: background 0.15s ease;
  }
  .boton:hover { background: var(--acento-hover); }
  .boton.secundario { background: var(--tarjeta); }
  .boton.secundario:hover { background: #223256; }
  .tarjetas-formulas { display: grid; gap: 10px; padding: 0; list-style: none; margin: 0; }
  .tarjeta {
    background: var(--tarjeta);
    padding: 14px 18px;
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .tarjeta .info b { color: var(--acento); }
  .tarjeta .info span { color: var(--texto-suave); font-size: 0.85rem; display: block; margin-top: 2px; }
  .boton-calcular {
    background: transparent;
    border: 1px solid var(--acento);
    color: var(--acento);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
  }
  .boton-calcular:hover { background: var(--acento); color: #fff; }
  #panel-resultados { margin-top: 36px; }
  .fila-resultado {
    background: var(--exito);
    padding: 10px 16px;
    border-radius: 8px;
    margin: 6px 0;
    font-size: 0.9rem;
  }
  .fila-resultado b { color: #7ee787; }
  .vacio { color: var(--texto-suave); font-style: italic; }
</style>
</head>
<body>
  <h1>🧮 Catálogo de Fórmulas</h1>

  <div class="barra-acciones">
    <button class="boton" onclick="ejecutarTodo()">Calcular las 10</button>
    <button class="boton secundario" onclick="refrescarHistorial()">Actualizar historial</button>
  </div>

  <ul class="tarjetas-formulas" id="lista-formulas"></ul>

  <div id="panel-resultados">
    <h2>Historial de cálculos</h2>
    <div id="lista-historial"></div>
  </div>

<script>
async function cargarCatalogo() {
  const respuesta = await fetch('/api/formulas');
  const formulas = await respuesta.json();
  const contenedor = document.getElementById('lista-formulas');
  contenedor.innerHTML = formulas.map((f) => `
    <li class="tarjeta">
      <div class="info">
        <b>${f.clave}. ${f.titulo}</b>
        <span>${f.notacion} · ${f.area}</span>
      </div>
      <button class="boton-calcular" onclick="calcularUna(${f.clave})">Calcular</button>
    </li>
  `).join('');
}

async function calcularUna(clave) {
  const respuesta = await fetch(`/api/formulas/${clave}/ejecutar`);
  const entrada = await respuesta.json();
  alert(`${entrada.titulo} = ${entrada.resultado}`);
  refrescarHistorial();
}

async function ejecutarTodo() {
  await fetch('/api/formulas/ejecutar-todas');
  refrescarHistorial();
}

async function refrescarHistorial() {
  const respuesta = await fetch('/api/resultados');
  const historial = await respuesta.json();
  const contenedor = document.getElementById('lista-historial');
  contenedor.innerHTML = historial.length
    ? historial.map((h) => `
        <div class="fila-resultado">#${h.clave} ${h.titulo}: ${h.notacion} → <b>${h.resultado}</b></div>
      `).join('')
    : '<p class="vacio">Todavía no hay cálculos registrados.</p>';
}

cargarCatalogo();
refrescarHistorial();
</script>
</body>
</html>
